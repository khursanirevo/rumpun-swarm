# seasons/s143.yaml — drafted by evolve v0 from s142; fill primary_change + evidence, then apply
id: s143
parent: s142
goal: "the template fixed: every light-lane phase carries its own written brief so a template-seeded season delivers real lane work, and the re-run proves it"
metric: "light-lane re-proofs"
mode: fight
methodology:
  approach: "one author lands the per-lane briefs in the steady-state template (each phase's prompt names its lane work, the artifacts, and the notes contract, emitted by init beside the template) with the s142 LOSS as the red-first proof; one author re-runs the fixed template's pipeline end to end in a tmp campaign proving real lane work lands, with the walk pinned; fable route, 60-minute budgets"
  evidence:
    - "ledger:s142-harvest@435df86ef478ca2ade250cd0b09a73b0ddc90a2f71ff57b22f655341d6f1ea66"
  primary_change:
    type: add            # add | fix | remove | rewire | retune (P12/P34 grammar)
    node: execute
    baseline: "s142 LOSS (all three lanes ran the generic prompt with no lane work and produced nothing; the gate marked all three; merged-tree suite 853 passed 1 xfailed; measured by the sealed harvest record s142-harvest)"
    expected_band: "WIN if the steady-state template emits per-lane briefs (each phase's prompt names its lane work and the notes contract) with the init-emission pinned red-first, the fixed pipeline proves real lane work end to end in a tmp campaign, and the merged-tree full suite is green; LOSS if any pin reds for the wrong reason or a known red regresses; NEUTRAL if the operator blocks a front (the band authorizes it)"
    rollback: "git revert the s143 commits; the ledger and the season state survive untouched"
    eval_window: "the tmp walk's capture plus the merged-tree full pytest; the briefs and the walk read from the writers notes.md"
  pipeline:
    - phase: lint-sweep
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: sweep.jsonl
    - phase: route-probes
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: probes.jsonl
    - phase: rehearsals
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      reads: [sweep.jsonl, probes.jsonl]
      writes: rehearsals.jsonl
    - phase: decision-gate
      primitive: evaluate
      agents: writers
      prompt: prompts/base/evaluate.md
      reads: rehearsals.jsonl
      writes: gate-report.jsonl
writers:
  - name: w1
    route: fable
    lane: template-briefs
    collab: build
    prompt: prompts/dev/w1-template-briefs.md
    knowledge: partial
    budget: {minutes: 60}
  - name: w2
    route: fable
    lane: pipeline-proof
    collab: build
    prompt: prompts/dev/w2-pipeline-proof.md
    knowledge: partial
    budget: {minutes: 60}
stop:
  "on": [all_exited, {stall_minutes: 30}, budget_exhausted]
