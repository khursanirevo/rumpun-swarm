# seasons/s113.yaml — drafted by evolve v0 from s112; fill primary_change + evidence, then apply
id: s113
parent: s112
goal: "the review-at-a-glance pass: the audit names each season's second opinion beside its judge verdict, and the machine report renders the marks the epic view already carries"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author extends the audit --last surface with the panel column (judge verdict, latest panel verdict, dissent flag per season) reusing the render's resolution, with red-first pins; one author extends the deterministic report to render the incomplete marker and the dissent marks, with red-first pins; fable route, 60-minute budgets"
  evidence:
    - "ledger:s112-harvest@e98a8ec13bfdd570e93ad9a297ff4b37bc43ae15343d0e4c76a7936091e2d290"
  primary_change:
    type: add            # add | fix | remove | rewire | retune (P12/P34 grammar)
    node: tooling
    baseline: "s112 best (both fable writers exited 0 at 1375.2s; the notes gate landed with measured red-first pins; the dissent mark verified over the real ledger; merged-tree suite 579/579; measured by the sealed harvest record s112-harvest)"
    expected_band: "WIN if the audit --last output names each season's judge verdict with its latest panel verdict and dissent flag (pinned red-first), the deterministic report renders the incomplete marker and the dissent marks from persisted state alone (pinned red-first), and the merged-tree full suite is green; LOSS if any pin reds for the wrong reason or a known red regresses; NEUTRAL if the operator blocks a front (the band authorizes it)"
    rollback: "git revert the s113 commits; the ledger and the season state survive untouched"
    eval_window: "both lanes' pins plus the merged-tree full pytest; the audit column and the report marks read from the writers notes.md and the verb outputs"
  pipeline:
    - phase: execute
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: results.jsonl
      writes: verdicts.jsonl
writers:
  - name: w1
    route: fable
    lane: audit-panel-col
    collab: build
    prompt: prompts/dev/w1-audit-panel-col.md
    knowledge: partial
    budget: {minutes: 60}
  - name: w2
    route: fable
    lane: report-marks
    collab: build
    prompt: prompts/dev/w2-report-marks.md
    knowledge: partial
    budget: {minutes: 60}
stop:
  "on": [all_exited, {stall_minutes: 15}, budget_exhausted]
