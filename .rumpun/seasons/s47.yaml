parent: s46
goal: "plugin machinery completed: the resolver and manifest gates reconciled to the pinned interface, the campaign/ exclusion enforced in the installer, and the test suite migrated to the new-layout fixtures"
metric: modules_integrated
mode: fight
methodology:
