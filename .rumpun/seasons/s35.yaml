# musim/s35.yaml — drafted by evolve v0 from s34; filled by harness from audit-24 + the usefulness residuals (operator standing order: continuous loop)
id: s35
parent: s34
goal: "verdict-versus-artifact consistency: run_audit cross-checks each audited season's verdict against its own results.jsonl rows - a WIN season whose rows carry FAIL arms a candidate instead of passing silently"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author lands the cross-check in run_audit (per audited season: read results.jsonl unit verdicts; any FAIL row under a WIN season verdict arms a mismatch candidate citing both) and one spec-first tester pins it; shared build lane; fable route, 40-minute budgets"
  evidence:
    - akar:audit-24@475c784f82da47cec47bc9075b0887ba0b2c53d35e95c173e1510df9a271af5f
    - akar:usefulness-decade-3@3d4d28d7004c75d23a3ebcf383ef4562123d535965645cb4f2af318e4bf4857b
  primary_change:
    type: add
    node: audit
    baseline: "the audit's F3 histogram counts result rows and F5 checks integrated flags, but nothing compares a season's verdict against the verdicts inside its own results.jsonl: a season harvested WIN while its own unit rows say FAIL passes every reflection check (the usefulness auditor's 'ledger establishes verdict labels, not implementation correctness' residual, made concrete)"
    expected_band: "WIN if run_audit arms a mismatch candidate when a season's verdict is WIN while any of its results.jsonl unit rows carries verdict FAIL (repro) AND consistent seasons arm nothing (repro) AND seasons without results rows are unaffected AND the candidate cites the season and the failing unit AND the suite is green (166+ tests); LOSS otherwise"
    rollback: "git revert s35 commits; the cross-check is additive audit input"
    eval_window: "repro pins over fixture ledgers + merged-tree pytest"
  pipeline:
    - phase: execute
      primitive: execute
      agents: benih
      prompt: prompts/base/execute.md
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: results.jsonl
      writes: verdicts.jsonl
