# musim/s9.yaml — drafted by evolve v0 from s8; filled by harness 2026-09-14 (lane observational)
id: s9
parent: s8
goal: "empty the stub registry: evolve rollback contains applied seasons and records the P33 decision"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author for evolve+cli, one spec-first tester, shared build lane for a sixth dogfood sample; band rests on repo-side deliverables only"
  evidence:
    - akar:s8-harvest@f4a3b83817121ad85158be4c091e56dddef98c70b1dab4613c627fa589b1ec06
  primary_change:
    type: add
    node: execute
    baseline: "s8 WIN: approve/reject ledger-backed; evolve rollback is the only remaining stub in the registry"
    expected_band: "WIN if rollback moves an applied season to musim/rejected AND appends its akar record AND refuses missing/foreign ids AND the suite is green; LOSS otherwise. Lane events recorded, not gating."
    rollback: "git revert s9 commits and remove musim/s9.yaml"
    eval_window: "s9 season suite + merged-tree pytest + rollback smoke in a scratch project"
  pipeline:
    - phase: analyze
      primitive: analyze
      agent: analyst
      prompt: prompts/base/analyze.md
      writes: errors.jsonl
    - phase: rank_gaps
      primitive: rank_gaps
      agent: analyst
      prompt: prompts/base/rank_gaps.md
      reads: errors.jsonl
      writes: gaps.yaml
      top_n: 3
    - phase: hypothesize
      primitive: hypothesize
      agent: swarm
      prompt: prompts/base/hypothesize.md
      reads: gaps.yaml
      writes: hypotheses.yaml
      per: gap
      max_concurrent: 3
    - phase: plan
      primitive: plan
      agent: planner
      prompt: prompts/base/plan.md
      reads: hypotheses.yaml
      writes: experiments.yaml
    - phase: falsify
      primitive: falsify
      agent: critic
      prompt: prompts/base/falsify.md
      reads: experiments.yaml
      writes: falsification.yaml
    - phase: execute
      primitive: execute
      agents: benih
      prompt: prompts/base/execute.md
      reads: falsification.yaml
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: [falsification.yaml, results.jsonl]
      writes: verdicts.jsonl
benih:
  - name: w1
    route: glm
    lane: rollback-impl
    collab: build
    prompt: prompts/dev/w1-rollback.md
    knowledge: partial
    budget: {minutes: 25}
  - name: w2
    route: glm
    lane: rollback-tests
    collab: build
    prompt: prompts/dev/w2-rollback-tests.md
    knowledge: partial
    budget: {minutes: 25}
stop:
  "on": [all_exited, {stall_minutes: 20}, budget_exhausted]
