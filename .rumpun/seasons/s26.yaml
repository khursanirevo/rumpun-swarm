# musim/s26.yaml — drafted by evolve v0 from s25; filled by harness from audit-14 + audit-13 (two consecutive zero-candidate audits: the reflection's own blind spot is the evidence)
id: s26
parent: s25
goal: "reflection closes its own blind spot: the audit ingests the corpus matrix, so a future regression on main arms a candidate automatically instead of waiting for a human to rerun the gate"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author extends run_audit to ingest the corpus matrix when present (a REGRESSION verdict arms a candidate citing the matrix; an all-green matrix yields a finding); one spec-first tester pins the ingestion contract; shared build lane; fable route, 40-minute budgets"
  evidence:
    - akar:audit-14@383fe09abf90173b8c9000d60efac95aecd1c7cbc49f2bb35ea1eab75594fddc
    - akar:audit-13@90926b6da1b7a103d4921e65ac5d9bae8144ba4de632c8f77517395081716941
    - akar:s25-harvest@2d44cc5993432549e7d09584cc0b89d3eb80a8c9950a848e3c58a3ca379a5a6b
  primary_change:
    type: add
    node: audit
    baseline: "the corpus matrix (tools/replay_corpus.py output, committed under evidence) is the only artifact that can show a regression on main, and reflection never reads it: audit-13 and audit-14 both armed zero candidates while the matrix did not exist as an input; a regression would wait for a human to rerun the gate"
    expected_band: "WIN if run_audit ingests a corpus matrix when one is present AND a REGRESSION verdict arms a candidate citing the matrix record AND an all-green matrix yields a plain finding (not a candidate) AND a missing matrix changes nothing (backward compatible) AND the suite is green (124+ tests); LOSS otherwise"
    rollback: "git revert s26 commits; the ingestion is additive audit input"
    eval_window: "repro pins over fixture matrices + merged-tree pytest"
  pipeline:
    - phase: execute
      primitive: execute
      agents: benih
      prompt: prompts/base/execute.md
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: results.jsonl
      writes: verdicts.jsonl
benih:
  - name: w1
    route: fable
    lane: matrix-ingest
    collab: build
    prompt: prompts/dev/w1-audit-matrix.md
    knowledge: partial
    budget: {minutes: 40}
  - name: w2
    route: fable
    lane: matrix-pins
    collab: build
    prompt: prompts/dev/w2-audit-matrix-pins.md
    knowledge: partial
    budget: {minutes: 40}
stop:
  "on": [all_exited, {stall_minutes: 15}, budget_exhausted]
