  pipeline:
    - phase: lint-sweep
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: sweep.jsonl
    - phase: route-probes
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: probes.jsonl
    - phase: rehearsals
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      reads: [sweep.jsonl, probes.jsonl]
      writes: rehearsals.jsonl
    - phase: decision-gate
      primitive: evaluate
      agents: writers
      prompt: prompts/base/evaluate.md
      reads: rehearsals.jsonl
      writes: gate-report.jsonl
