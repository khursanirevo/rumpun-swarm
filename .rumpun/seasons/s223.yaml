  evidence: ["ledger:s221-harvest@f0358507beb13eccffe18ccb6df54402dbd93f0d5031461780291827277c4589"]
  primary_change:
    type: add            # add | fix | remove | rewire | retune (P12/P34 grammar)
    node: execute
    baseline: "s221 best (both fable writers exited 0 at 1103.9s; guards 156/156 green fresh, rehearsals 12/12 green fresh, drift none; sealed harvest s221-harvest). s222 failed: w2 hit an upstream 429 rate limit mid-turn while w1 exited 0; not a regression of the work."
