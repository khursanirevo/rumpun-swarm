    - "ledger:s121-harvest@d930aec1f3ffa149ece8a8eddaedc4ded0b4679aa48ede5106b98ba42ebe11ea"
  primary_change:
    type: add            # add | fix | remove | rewire | retune (P12/P34 grammar)
    node: execute
    baseline: "s121 best (both fable writers exited 0 at 1257.6s; the ninth assessment sealed on the adjusted counts and the campaign guide landed parser-linted; merged-tree suite 657/657; measured by the sealed harvest record s121-harvest)"
    expected_band: "WIN if issue #38 closes with the drought rule reconciled to the decade series and the boundary pinned red-first, issues #39 and #40 close with the no-src skip named and the pytest probe gating the venv fallback (pinned red-first), and the merged-tree full suite is green; LOSS if any pin reds for the wrong reason or a known red regresses; NEUTRAL if the operator blocks a front (the band authorizes it)"
    rollback: "git revert the s122 commits; the ledger and the season state survive untouched"
    eval_window: "both lanes' pins plus the merged-tree full pytest; the verb outputs read from the writers notes.md"
  pipeline:
    - phase: execute
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: results.jsonl
      writes: verdicts.jsonl
