# seasons/s122.yaml — drafted by evolve v0 from s121; fill primary_change + evidence, then apply
id: s122
parent: s121
goal: "the reconcile-and-survive pass: the assessment drought counts every usefulness convention, and the close check names what a bare repo lacks instead of dying on it"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author reconciles the assessment-due drought with the usefulness-decade series (the decade records count toward the cadence or the rule names the exception) with red-first pins; one author makes the close check survive bare environments (a repo with no src gets a named pins-lane skip, and the venv python falls back only after probing pytest importability) with red-first pins; fable route, 60-minute budgets"
