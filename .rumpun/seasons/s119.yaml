# seasons/s119.yaml — drafted by evolve v0 from s118; fill primary_change + evidence, then apply
id: s119
parent: s118
goal: "the self-driving pass: the loop verb detects a finished season and seals a close-prep record the close worker confirms, and the board mirrors the ledger without a manual sync"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author extends the loop verb with the close-prep detection (a completed season with no harvest record seals a close-prep record carrying the classification draft; it never harvests, seeds, or commits itself) with red-first pins; one author lands the board sync (the board cards mirror the ledger verdicts on demand, no invented cards, idempotent) with red-first pins; fable route, 60-minute budgets"
  evidence:
    - "ledger:s118-harvest@1fe7ca43a763295d13c231e1473d41fde5ad57fe99e7b5241a33cc6058d30a2d"
  primary_change:
    type: add            # add | fix | remove | rewire | retune (P12/P34 grammar)
    node: execute
    baseline: "s118 best (both fable writers exited 0 at 1834.0s; the assessment seals the adjusted truth and the changelog is version-pinned; merged-tree suite 630/630; measured by the sealed harvest record s118-harvest)"
    expected_band: "WIN if the loop verb seals a close-prep record for a completed unharvested season and never harvests, seeds, or commits itself (pinned red-first), the board sync mirrors the ledger verdicts on demand without inventing cards and stays idempotent (pinned red-first), and the merged-tree full suite is green; LOSS if any pin reds for the wrong reason or a known red regresses; NEUTRAL if the operator blocks a front (the band authorizes it)"
    rollback: "git revert the s119 commits; the ledger and the season state survive untouched"
    eval_window: "both lanes' pins plus the merged-tree full pytest; the close-prep record and the board state read from the writers notes.md"
  pipeline:
    - phase: execute
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: results.jsonl
      writes: verdicts.jsonl
writers:
  - name: w1
    route: fable
    lane: loop-close-prep
    collab: build
    prompt: prompts/dev/w1-loop-close-prep.md
    knowledge: partial
    budget: {minutes: 60}
  - name: w2
    route: fable
    lane: board-sync
    collab: build
    prompt: prompts/dev/w2-board-sync.md
    knowledge: partial
    budget: {minutes: 60}
stop:
