    - akar:s39-harvest@2622c0c3fb400d3db2372b617a6a752117e660f4e8b3234bc130172c7913f9e7
  primary_change:
    type: retune
    node: core
    baseline: "the component vocabulary is Malay (benih, musim/, akar/, rimba/) while the CLI, the artifacts, and half the code are English - the mix reads as inconsistency, and the hub plan makes outside contributors the primary audience: benih is a wall they hit in their first five minutes, and a glossary taxes them forever"
