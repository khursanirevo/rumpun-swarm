# seasons/s61.yaml — drafted by evolve v0 from s60; filled by harness 2026-09-16 (audit-41's phase-liveness candidate: exercise or trim execute)
id: s61
parent: s60
goal: "the pipeline stops lying: results.jsonl is written in 0 of the last 10 engine seasons while every yaml still declares execute->evaluate - audit-41's candidate resolves by evidence, the pipeline declaration is exercised for real or trimmed honestly"
metric: modules_integrated
mode: fight
methodology:
  approach: "the workers pick the route by evidence: exercise the phase (a season's ledger actually holds results.jsonl, written by the pipeline path) or trim the declaration (the schema and lint stop requiring it, the audit's phase-liveness finding retires); one author lands the change, one tester pins both the new truth and the old finding's retirement; shared build lane; fable route, 40-minute budgets"
