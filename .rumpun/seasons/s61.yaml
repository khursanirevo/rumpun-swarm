    - ledger:s60-harvest@144c97b66d4e798abcb3949da2d9ef7993440b159e77700334ca2038e56b6c18
    - ledger:audit-41@1068a2f507f6e41f23f52217c281baaf40772d80505f587360f00a8a945dac7d
  primary_change:
    type: rewire
    node: engine
    baseline: "every season yaml since s1 declares execute->evaluate with declared artifact writes, and the engine seasons have written results.jsonl in 0 of the last 10: the declaration is vestigial, the audit's phase-liveness finding counts the gap every close, and audit-41 armed it first in pipeline order"
    expected_band: "WIN per audit-41's own clause: a later season's ledger holds results.jsonl (the phase exercised) OR the pipeline drops execute (the declaration trimmed, F1 retires with it) AND w2's pins hold the new truth both ways AND the suite floor holds; LOSS otherwise"
