id: s19
parent: s18
goal: "spawn and citation safety: termination re-checks process identity (H2), agents run inside their workspace (H3), evidence citations must match their recorded digest (H7)"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author fixes H2 + H3 in the engine (identity-checked termination, cwd=workspace); one author enforces digest comparison in citation resolution and pins H2/H3/H7 spec-first; shared build lane; fable route, 40-minute budgets"
  evidence:
    - akar:audit-7@3fde474b217d102140219922424db7994d311c7fefc0e7f9e2375a08131b3239
