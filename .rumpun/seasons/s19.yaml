    - akar:codex-review-2026-09-14@23bcca3defbf8c9645b74143ad7536ae173c21ef6cd7cd30f48915a81ff709cd
  primary_change:
    type: retune
    node: gate
    baseline: "termination signals killpg on a bare pid without re-checking recorded proc_start (a reused pid kills an innocent process group; crashed leaders leave descendants); Popen sets no cwd so workspaces are convention, not enforcement (reviewer's pwd route printed the repo dir); _citation_resolves captures the digest but never compares it, so the evolution gate accepts altered evidence"
    expected_band: "WIN if termination re-checks proc_start ownership before signaling (repro: a recycled pid is not signaled) AND spawned agents run with cwd set to their workspace (repro: pwd prints the workspace) AND a citation whose digest mismatches the record fails resolution and blocks apply (repro: tampered evidence rejected) AND the suite is green (84+ tests); LOSS otherwise"
    rollback: "git revert s19 commits; all three fixes are behavior tightening inside existing modules"
    eval_window: "repro tests mirroring the review's reproductions + merged-tree pytest"
  pipeline:
