# seasons/s118.yaml — drafted by evolve v0 from s117; fill primary_change + evidence, then apply
id: s118
parent: s117
goal: "the outcome-anchor pass: the assessment reads the adjusted truth when it seals, and the changelog states the version truth instead of lagging it"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author extends the assessment inputs to carry the epic rollup's adjusted counts beside the raw ones (the next seal judges on adjusted truth) with red-first pins; one author brings the changelog and readme to the current truth with a version-consistency pin that fails while the changelog lags the package version; fable route, 60-minute budgets"
  evidence:
    - "ledger:s117-harvest@50604b4f12106f6d28a8d1117d8df06049c8e7501e6f5304579a9d664c0ee84e"
  primary_change:
    type: add            # add | fix | remove | rewire | retune (P12/P34 grammar)
    node: execute
    baseline: "s117 best (both fable writers exited 0 at 2164.4s; the rollup renders the adjusted view over the real campaign and the matrix classifies all 145 scripts with zero unclassified; merged-tree suite 619/619; measured by the sealed harvest record s117-harvest)"
    expected_band: "WIN if the assessment inputs carry the adjusted counts beside the raw ones over the real campaign with no count rewritten (pinned red-first), the changelog carries dated sections through the current version with the consistency pin green, and the merged-tree full suite is green; LOSS if any pin reds for the wrong reason or a known red regresses; NEUTRAL if the operator blocks a front (the band authorizes it)"
    rollback: "git revert the s118 commits; the ledger and the season state survive untouched"
    eval_window: "both lanes' pins plus the merged-tree full pytest; the assessment inputs and the changelog state read from the writers notes.md"
  pipeline:
    - phase: execute
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: results.jsonl
      writes: verdicts.jsonl
writers:
  - name: w1
    route: fable
    lane: assessment-adjusted
    collab: build
    prompt: prompts/dev/w1-assessment-adjusted.md
    knowledge: partial
    budget: {minutes: 60}
  - name: w2
    route: fable
    lane: docs-truth
    collab: build
    prompt: prompts/dev/w2-docs-truth.md
    knowledge: partial
    budget: {minutes: 60}
stop:
  "on": [all_exited, {stall_minutes: 15}, budget_exhausted]
