# musim/s8.yaml — drafted by evolve v0 from s7; filled by harness 2026-09-14 (lane observational)
id: s8
parent: s7
goal: "operator approval tooling: evolve approve and reject as real verbs, ledger-backed"
metric: modules_integrated
mode: fight
methodology:
  approach: "one author for evolve+cli verbs, one spec-first tester, shared build lane for a fifth dogfood sample; band rests on repo-side deliverables only"
  evidence:
    - akar:s7-harvest@a6cc6e540e102e7025ec35770cc11dc9348758b23cf0641e242fc2538444db93
  primary_change:
    type: add
    node: execute
    baseline: "s7 WIN: P8 channel live, README at v0.7.0; evolve approve/reject are the remaining stubs beside rollback"
    expected_band: "WIN if evolve approve appends an akar record without touching the draft AND reject moves the draft to musim/rejected and appends its record AND the suite is green; LOSS otherwise. Lane events recorded, not gating."
    rollback: "git revert s8 commits and remove musim/s8.yaml"
    eval_window: "s8 season suite + merged-tree pytest + approve/reject smoke on a scratch draft"
  pipeline:
    - phase: analyze
      primitive: analyze
      agent: analyst
      prompt: prompts/base/analyze.md
      writes: errors.jsonl
    - phase: rank_gaps
      primitive: rank_gaps
      agent: analyst
      prompt: prompts/base/rank_gaps.md
      reads: errors.jsonl
      writes: gaps.yaml
      top_n: 3
    - phase: hypothesize
      primitive: hypothesize
      agent: swarm
      prompt: prompts/base/hypothesize.md
      reads: gaps.yaml
      writes: hypotheses.yaml
      per: gap
      max_concurrent: 3
    - phase: plan
      primitive: plan
      agent: planner
      prompt: prompts/base/plan.md
      reads: hypotheses.yaml
      writes: experiments.yaml
    - phase: falsify
      primitive: falsify
      agent: critic
      prompt: prompts/base/falsify.md
      reads: experiments.yaml
      writes: falsification.yaml
    - phase: execute
      primitive: execute
      agents: benih
      prompt: prompts/base/execute.md
      reads: falsification.yaml
      writes: results.jsonl
    - phase: evaluate
      primitive: evaluate
      agent: judge
      prompt: prompts/base/evaluate.md
      reads: [falsification.yaml, results.jsonl]
      writes: verdicts.jsonl
benih:
  - name: w1
    route: glm
    lane: approve-impl
    collab: build
    prompt: prompts/dev/w1-approve.md
    knowledge: partial
    budget: {minutes: 25}
  - name: w2
    route: glm
    lane: approve-tests
    collab: build
    prompt: prompts/dev/w2-approve-tests.md
    knowledge: partial
    budget: {minutes: 25}
stop:
  "on": [all_exited, {stall_minutes: 20}, budget_exhausted]
